# pnpm blocks dependency install scripts by default — an explicit allowlist is a
# real supply-chain control, so keep this list as short as it can be.
# These three fetch platform-native binaries and genuinely need to build.
allowBuilds:
  esbuild: true
  workerd: true
  unrs-resolver: true
  # Optional transitive of the SBOM tool; not needed.
  libxmljs2: false
minimumReleaseAgeExclude:
  - "@opennextjs/aws@4.1.3"
  - "@opennextjs/cloudflare@1.20.5"
  - "@typescript-eslint/eslint-plugin@8.69.0"
  - "@typescript-eslint/parser@8.69.0"
  - "@typescript-eslint/project-service@8.69.0"
  - "@typescript-eslint/scope-manager@8.69.0"
  - "@typescript-eslint/tsconfig-utils@8.69.0"
  - "@typescript-eslint/type-utils@8.69.0"
  - "@typescript-eslint/types@8.69.0"
  - "@typescript-eslint/typescript-estree@8.69.0"
  - "@typescript-eslint/utils@8.69.0"
  - "@typescript-eslint/visitor-keys@8.69.0"
  - typescript-eslint@8.69.0

# Forced dependency versions. Each entry needs a reason and should be removed
# once upstream ships the fix.
overrides:
  # cdxgen (dev-only, SBOM generation) pins undici 7.28.0, which is affected by
  # GHSA-4cwx-7wf7-3272 (cross-user information disclosure). 7.29.0 is the fix
  # and is already in the tree via wrangler.
  undici: ">=7.29.0"
